<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>GitLab Issues Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .issue {
      border: 1px solid #ddd;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .title {
      font-weight: bold;
      font-size: 18px;
    }

    .meta {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

<h1>GitLab Issues Test</h1>
<p id="status">Lade Issues...</p>

<div id="issues"></div>

<script>
const API_URL = "https://git.htl-klu.at/api/v4/groups/15704/issues?state=opened";

fetch(API_URL)
  .then(res => {
    if (!res.ok) {
      throw new Error("HTTP Error " + res.status);
    }
    return res.json();
  })
  .then(data => {
    document.getElementById("status").innerText =
      "Gefundene Issues: " + data.length;

    const container = document.getElementById("issues");

    data.forEach(issue => {
      const div = document.createElement("div");
      div.className = "issue";

      div.innerHTML = `
        <div class="title">${issue.title}</div>
        <div class="meta">
          Projekt: ${issue.references?.full || "unknown"}<br>
          Status: ${issue.state}<br>
          <a href="${issue.web_url}" target="_blank">Open in GitLab</a>
        </div>
      `;

      container.appendChild(div);
    });
  })
  .catch(err => {
    document.getElementById("status").innerText =
      "Fehler beim Laden: " + err.message;

    console.error(err);
  });
</script>

</body>
</html>
